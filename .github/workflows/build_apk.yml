
name: Gerar APK do Conferente Pro

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'release/v1.2.0-cd-mensal' ]

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Preparar chave digital
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/conferentepro-release.jks"

      - name: Compilar APK assinado
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/conferentepro-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ConferentePro-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
