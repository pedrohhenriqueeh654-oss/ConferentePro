
name: Gerar APK do Conferente Pro
# Rebuild após alinhar o leitor ao asset Tratativas_RO.json.gz

on:
  workflow_dispatch:
  push:
    branches: [ main, master, 'release/v1.2.0-cd-mensal' ]

permissions:
  contents: read

jobs:
  build:
    name: Compilar APK
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o projeto
        uses: actions/checkout@v4

      - name: Preparar base de tratativas RO a partir da planilha
        run: |
          python3 -m pip install --disable-pip-version-check openpyxl==3.1.5
          python3 - <<'PY'
          import gzip, json, os
          from openpyxl import load_workbook

          source = "app/src/main/assets/Consulta_Tratativas_V4.4.2.xlsx"
          target = "app/src/main/assets/Tratativas_RO.json.gz"
          if not os.path.isfile(source):
              raise SystemExit("Planilha Consulta_Tratativas_V4.4.2.xlsx não encontrada em app/src/main/assets")

          wb = load_workbook(source, read_only=True, data_only=True)
          required_sheets = ["EAN_RO", "Base Trat RO"]
          missing = [name for name in required_sheets if name not in wb.sheetnames]
          if missing:
              raise SystemExit("Abas obrigatórias ausentes: " + ", ".join(missing))

          def text_value(value):
              if value is None:
                  return ""
              if isinstance(value, bool):
                  return str(value)
              if isinstance(value, int):
                  return str(value)
              if isinstance(value, float) and value.is_integer():
                  return str(int(value))
              return str(value).strip()

          def read_selected(sheet_name, expected_headers):
              ws = wb[sheet_name]
              header = [text_value(v).strip() for v in next(ws.iter_rows(min_row=1, max_row=1, values_only=True))]
              normalized = [h.casefold() for h in header]
              indexes = []
              for label in expected_headers:
                  key = label.strip().casefold()
                  if key not in normalized:
                      raise SystemExit(f"Coluna obrigatória '{label}' não encontrada na aba '{sheet_name}'. Cabeçalhos: {header}")
                  indexes.append(normalized.index(key))
              rows = []
              for raw in ws.iter_rows(min_row=2, values_only=True):
                  selected = [text_value(raw[i]) if i < len(raw) else "" for i in indexes]
                  if any(value.strip() for value in selected):
                      rows.append(selected)
              return rows

          ean_rows = read_selected("EAN_RO", ["Barras", "Código", "Descrição", "Nome Grupo", "ID Fabricante", "Fabricante - Laboratório"])
          trat_rows = read_selected("Base Trat RO", ["Cód. Fabricante", "Fabricante", "Comprador", "Policita de troca Fornecedor", "Tipo de Negociação", "Tipo de Saida", "Ação", "LOJA/CD"])
          ean_rows = [row for row in ean_rows if row[0].strip()]
          payload = {"eanRows": ean_rows, "tratRows": trat_rows}
          # Teste de integridade obrigatório com EAN real já validado.
          teste_ean = "7891317032470"
          linha_ean = next((r for r in ean_rows if r[0].strip() == teste_ean), None)
          if linha_ean is None:
              raise SystemExit("TESTE FALHOU: EAN de validação ausente.")
          id_fabricante = linha_ean[4].strip()
          linha_tratativa = next((r for r in trat_rows if r[0].strip() == id_fabricante), None)
          if linha_tratativa is None or not linha_tratativa[6].strip():
              raise SystemExit("TESTE FALHOU: tratativa ou ação ausente para o EAN de validação.")
          if "Emitir Nota de Perda na loja" not in linha_tratativa[6]:
              raise SystemExit("TESTE FALHOU: ação divergente para o EAN de validação.")
          print("TESTE OK: EAN " + teste_ean + " -> fabricante " + id_fabricante + " -> " + linha_tratativa[6])
          os.makedirs(os.path.dirname(target), exist_ok=True)
          with gzip.open(target, "wt", encoding="utf-8", newline="") as output:
              json.dump(payload, output, ensure_ascii=False, separators=(",", ":"))
          print(f"Base RO gerada: {len(ean_rows)} registros EAN e {len(trat_rows)} registros de tratativa; {os.path.getsize(target)} bytes compactados")
          # A planilha-fonte não precisa ser empacotada no APK; somente a base convertida.
          os.remove(source)
          PY

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Criar Gradle Wrapper
        run: gradle wrapper --gradle-version 8.7

      - name: Preparar chave digital
        env:
          SIGNING_KEY_BASE64: ${{ secrets.SIGNING_KEY_BASE64 }}
        run: |
          printf '%s' "$SIGNING_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/conferentepro-release.jks"

      - name: Compilar APK assinado
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/conferentepro-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: ConferentePro-Release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
